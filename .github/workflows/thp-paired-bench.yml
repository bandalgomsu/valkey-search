name: THP paired benchmark

# Parent vs candidate HNSW latency, measured side by side on one runner.
# Both servers load the same RDB and one client alternates each query between them,
# so host noise hits both builds equally.
on:
  push:
    branches: [bench/thp-paired]
  workflow_dispatch:

env:
  PARENT_REF: 17ffbe0ffb9b92374cadd35c693d76a0d6c7bda0
  CANDIDATE_REF: 965056c56342fb1e000841a02707b2840f83d667
  VALKEY_REF: "9.2"
  # Space-separated DIM:DOCS pairs, measured one after another on the same runner.
  # The 64-dim set is 472,362 docs to match the prebuilt RDB.
  DATASETS: "128:500000 64:472362"
  EF_RUNTIME: "100"
  WARMUP_S: "30"
  MEASURE_S: "120"
  SEED_RDB_BASE: https://github.com/bandalgomsu/valkey-search/releases/download/thp-bench-data

jobs:
  build:
    name: build ${{ matrix.tree }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
        tree: [parent, candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out ${{ matrix.tree }} tree
        run: |
          ref=${{ matrix.tree == 'parent' && env.PARENT_REF || env.CANDIDATE_REF }}
          git log -1 --oneline "$ref"
          mkdir -p "$RUNNER_TEMP/src"
          git archive "$ref" | tar -x -C "$RUNNER_TEMP/src"

      - uses: docker/setup-buildx-action@v3
      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: bench-image
          load: true
          cache-from: type=gha,scope=devimage-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=devimage-${{ matrix.runner }}

      # ccache hits only on re-runs of the same tree: the candidate touches
      # valkey_module.h, which nearly every translation unit includes.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-thp-${{ matrix.runner }}-${{ matrix.tree }}-${{ github.sha }}
          restore-keys: ccache-thp-${{ matrix.runner }}-${{ matrix.tree }}-

      - name: Build libsearch.so (release, no unit tests)
        run: |
          mkdir -p "$RUNNER_TEMP/ccache" && chmod a+rwX "$RUNNER_TEMP/ccache"
          docker run --privileged --rm \
            -v "$RUNNER_TEMP/src:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/ccache:/ccache" \
            -e CMAKE_EXTRA_ARGS=-DBUILD_UNIT_TESTS=OFF \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=2G \
            --user "ubuntu:ubuntu" \
            bench-image bash -c '
              # The arm64 deps package ships without google benchmark CMake files.
              if [ "$(uname -m)" = aarch64 ]; then
                sudo apt-get update -qq && sudo apt-get install -y -qq libbenchmark-dev
              fi
              sudo -E ci/build_ubuntu.sh && ccache -s'
          sudo chmod -R a+rX "$RUNNER_TEMP/ccache"
          ls -la "$RUNNER_TEMP/src/.build-release/libsearch.so"

      - uses: actions/upload-artifact@v4
        with:
          name: libsearch-${{ matrix.tree }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/src/.build-release/libsearch.so
          retention-days: 7

  bench:
    name: bench (${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set THP to madvise and verify the page sizes
        run: |
          echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/defrag
          enabled=$(cat /sys/kernel/mm/transparent_hugepage/enabled)
          defrag=$(cat /sys/kernel/mm/transparent_hugepage/defrag)
          pmd=$(cat /sys/kernel/mm/transparent_hugepage/hpage_pmd_size)
          page=$(getconf PAGESIZE)
          {
            echo "### Environment (${{ matrix.runner }})"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Kernel | \`$(uname -r)\` |"
            echo "| CPU | $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1) |"
            echo "| vCPUs / MemTotal | $(nproc) / $(grep MemTotal /proc/meminfo | awk '{print $2}') kB |"
            echo "| THP enabled | \`$enabled\` |"
            echo "| THP defrag | \`$defrag\` |"
            echo "| hpage_pmd_size / PAGESIZE | $pmd / $page |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$enabled" == *"[madvise]"* ]] || { echo "::error::THP enabled is not madvise: $enabled"; exit 1; }
          [[ "$defrag" == *"[madvise]"* ]] || { echo "::error::THP defrag is not madvise: $defrag"; exit 1; }
          [[ "$pmd" == 2097152 ]] || { echo "::error::hpage_pmd_size is $pmd, not 2 MiB"; exit 1; }
          [[ "$page" == 4096 ]] || { echo "::error::PAGESIZE is $page, not 4 KiB"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: libsearch-parent-${{ matrix.runner }}
          path: modules/A
      - uses: actions/download-artifact@v4
        with:
          name: libsearch-candidate-${{ matrix.runner }}
          path: modules/B

      - uses: docker/setup-buildx-action@v3
      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: bench-image
          load: true
          cache-from: type=gha,scope=devimage-${{ matrix.runner }}

      - name: Build Valkey ${{ env.VALKEY_REF }}
        run: |
          git clone --depth 1 --branch "$VALKEY_REF" https://github.com/valkey-io/valkey.git "$RUNNER_TEMP/valkey"
          make -C "$RUNNER_TEMP/valkey" -j"$(nproc)" BUILD_TLS=no
          "$RUNNER_TEMP/valkey/src/valkey-server" --version

      - name: Start bench container
        run: |
          # Artifacts drop the execute bit, and Valkey refuses to load a module without it.
          chmod +x modules/A/libsearch.so modules/B/libsearch.so
          mkdir -p "$RUNNER_TEMP/work"
          cp .github/thp-bench/*.py .github/thp-bench/*.sh "$RUNNER_TEMP/work/"
          chmod -R a+rwX "$RUNNER_TEMP/work" "$RUNNER_TEMP/valkey"
          docker run -d --name bench \
            -v "$RUNNER_TEMP/work:/s/bench1m" \
            -v "$RUNNER_TEMP/valkey:/s/valkey92" \
            -v "$PWD/modules/A/libsearch.so:/m/A.so:ro" \
            -v "$PWD/modules/B/libsearch.so:/m/B.so:ro" \
            bench-image sleep infinity

      # The RDBs depend only on the datasets and the module's serialization,
      # so they are reused across runs of the same candidate.
      - name: Restore RDBs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/work/data-*/dump.rdb
          key: rdb-${{ matrix.runner }}-${{ env.DATASETS }}-${{ env.CANDIDATE_REF }}

      # A prebuilt RDB attached to the fork's release skips a 30-45 minute load.
      # It is used only if it loads with the candidate module and holds DOCS documents.
      - name: Prepare RDBs (cache, seeded release asset, or load from scratch)
        run: |
          for ds in $DATASETS; do
            dim=${ds%%:*}; docs=${ds##*:}; d="$RUNNER_TEMP/work/data-$dim"
            mkdir -p "$d"
            if [ -f "$d/dump.rdb" ]; then
              echo "${docs} x ${dim}-dim: using cached RDB" | tee -a "$GITHUB_STEP_SUMMARY"; continue
            fi
            url="$SEED_RDB_BASE/dump-${docs}x${dim}.rdb"
            curl -fsSL -o "$d/dump.rdb" "$url" || rm -f "$d/dump.rdb"
            sudo chmod -R a+rwX "$d"
            if [ -f "$d/dump.rdb" ] && docker exec bench /s/bench1m/phase.sh verify "$docs" "/s/bench1m/data-$dim"; then
              echo "${docs} x ${dim}-dim: using seeded RDB $url" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "${docs} x ${dim}-dim: seeded RDB unavailable or invalid; loading from scratch" | tee -a "$GITHUB_STEP_SUMMARY"
              rm -f "$d/dump.rdb"
              docker exec bench /s/bench1m/phase.sh build "$docs" "$dim" "/s/bench1m/data-$dim"
            fi
          done

      # Best effort: cloud VMs may not expose hardware counters. Only events that
      # return a number in a one-second probe are kept; otherwise perf is skipped.
      - name: Set up perf TLB counters (best effort)
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" >/dev/null 2>&1 \
            || sudo apt-get install -y -qq linux-tools-generic >/dev/null 2>&1 || true
          sudo sysctl -qw kernel.perf_event_paranoid=-1 || true
          PERF=$(ls "/usr/lib/linux-tools/$(uname -r)/perf" /usr/lib/linux-tools/*/perf 2>/dev/null | head -1 || true)
          events=""
          if [ -n "$PERF" ]; then
            candidates="dTLB-loads,dTLB-load-misses"
            list=$(sudo "$PERF" list 2>/dev/null || true)
            for e in dtlb_load_misses.walk_completed dtlb_load_misses.walk_active l1d_tlb_refill l2d_tlb_refill dtlb_walk; do
              grep -qw "$e" <<<"$list" && candidates="$candidates,$e"
            done
            probe=$(sudo "$PERF" stat -x, -e "$candidates" -- sleep 1 2>&1 || true)
            echo "$probe"
            # Some VMs list the events but never count them; keep only non-zero counts.
            events=$(grep -E '^[0-9.]*[1-9][0-9.]*,' <<<"$probe" | cut -d, -f3 | paste -sd, - || true)
          fi
          if [ -n "$events" ]; then
            echo "$PERF" > "$RUNNER_TEMP/work/perf-bin"; echo "$events" > "$RUNNER_TEMP/work/perf-events"
            echo "perf counters: \`$events\`" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "perf counters: unavailable on this runner" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Paired measurement (CPU sets swapped between runs)
        run: |
          sudo chmod -R a+rwX "$RUNNER_TEMP"/work/data-*
          for ds in $DATASETS; do
            dim=${ds%%:*}
            echo "::group::${ds} run1"; bash .github/thp-bench/host-pair.sh "$dim" run1 0 1; echo "::endgroup::"
            echo "::group::${ds} run2"; bash .github/thp-bench/host-pair.sh "$dim" run2 1 0; echo "::endgroup::"
          done

      - name: Summarize
        run: |
          for ds in $DATASETS; do
            dim=${ds%%:*}; docs=${ds##*:}; d="$RUNNER_TEMP/work/data-$dim"
            python3 .github/thp-bench/summarize.py "$d" \
              "${docs} x ${dim}-dim, EF_RUNTIME ${EF_RUNTIME} (${{ matrix.runner }})" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -q "'rollup_AnonHugePages_kB': [1-9]" "$d"/pair/thp-B-*.txt \
              || { echo "::error::${ds}: candidate has no AnonHugePages; THP was not applied"; exit 1; }
          done
          grep -h "thp_fault" /proc/vmstat

      # Upper bound of what THP can give this workload: the parent module run twice,
      # once with THP disabled for the process and once with THP for the whole process
      # (vectors, keys and level-0). Valkey's disable-thp only acts when THP is "always".
      - name: THP ceiling (parent without THP vs parent with process-wide THP)
        run: |
          set_thp() {
            echo "$1" | sudo tee /sys/kernel/mm/transparent_hugepage/enabled >/dev/null
            echo "$1" | sudo tee /sys/kernel/mm/transparent_hugepage/defrag >/dev/null
          }
          trap 'set_thp madvise' EXIT
          set_thp always
          export MOD_A=A MOD_B=A ARGS_A="--disable-thp yes" ARGS_B="--disable-thp no" OUT_SUBDIR=ceiling
          for ds in $DATASETS; do
            dim=${ds%%:*}
            echo "::group::${ds} ceiling run1"; bash .github/thp-bench/host-pair.sh "$dim" run1 0 1; echo "::endgroup::"
            echo "::group::${ds} ceiling run2"; bash .github/thp-bench/host-pair.sh "$dim" run2 1 0; echo "::endgroup::"
          done
          export LABEL_A="No THP" LABEL_B="Process-wide THP"
          for ds in $DATASETS; do
            dim=${ds%%:*}; docs=${ds##*:}
            python3 .github/thp-bench/summarize.py "$RUNNER_TEMP/work/data-$dim" \
              "THP ceiling: ${docs} x ${dim}-dim, parent module (${{ matrix.runner }})" ceiling | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Print server logs on failure
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/work/data-*/server-*.log "$RUNNER_TEMP"/work/data-*/pair/server-*.log "$RUNNER_TEMP"/work/data-*/ceiling/server-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f (last 100 lines)"; tail -100 "$f"; echo "::endgroup::"
          done
          free -m; df -h "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thp-bench-results-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/work/data-*/pair/
            ${{ runner.temp }}/work/data-*/ceiling/
            ${{ runner.temp }}/work/data-*/server-*.log
          retention-days: 90
